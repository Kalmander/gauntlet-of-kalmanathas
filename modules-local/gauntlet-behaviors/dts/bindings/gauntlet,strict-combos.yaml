# SPDX-License-Identifier: MIT

description: Gauntlet strict combos container

compatible: "gauntlet,strict-combos"

child-binding:
  description: "A strict combo"

  properties:
    bindings:
      type: phandle-array
      required: true
    key-positions:
      type: array
      required: true
    timeout-ms:
      type: int
      default: 50
    require-prior-idle-ms:
      type: int
      default: -1
    require-overlap-ms:
      type: int
      default: 0
    slow-release:
      type: boolean
    layers:
      type: array
