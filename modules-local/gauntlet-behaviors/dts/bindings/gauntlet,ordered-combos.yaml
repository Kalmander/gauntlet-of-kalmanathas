# SPDX-License-Identifier: MIT

description: Gauntlet ordered combos container

compatible: "gauntlet,ordered-combos"

child-binding:
  description: "An ordered combo"

  properties:
    bindings:
      type: phandle-array
      required: true
    key-positions:
      type: array
      required: true
      description: Exact press order for this combo.
    timeout-ms:
      type: int
      default: 50
    require-prior-idle-ms:
      type: int
      default: -1
    slow-release:
      type: boolean
    layers:
      type: array
